<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C&C Shopping Cart</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: radial-gradient(circle at top,#1b1f3a,#05060b); color: #f5e7c8; font-family: "Inter", sans-serif; padding: 40px 20px; }
        nav { width: 92%; margin: 0 auto 40px auto; padding: 18px 35px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,.06); backdrop-filter: blur(25px); border-radius: 30px; border: 1px solid rgba(232,193,108,.25); }
        nav a { color: white; text-decoration: none; font-family: "Cinzel", serif; }
        .cart-wrapper { max-width: 650px; margin: 40px auto; background: rgba(255,255,255,.04); border: 1px solid rgba(232,193,108,.15); padding: 35px; border-radius: 25px; backdrop-filter: blur(25px); }
        h2 { font-family: "Cinzel", serif; color: #e8c16c; text-align: center; margin-bottom: 25px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(232,193,108,0.1); }
        .item-title { font-family: "Cormorant Garamond", serif; font-size: 1.5rem; color: #e8c16c; }
        .totals-box { margin-top: 25px; padding-top: 15px; border-top: 1px solid rgba(232,193,108,0.2); font-size: 0.95rem; color: #bbb; }
        .totals-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .btn { display: inline-block; width: 100%; text-align: center; padding: 14px; background: #e8c16c; color: #05060b; border: none; border-radius: 50px; font-weight: 600; text-decoration: none; cursor: pointer; margin-top: 20px; transition: .3s; }
        .btn:hover { box-shadow: 0 0 25px #e8c16c; transform: scale(1.01); }
    </style>
</head>
<body>
<nav>
    <a href="index.html">← Back to Store</a>
    <div style="color:#e8c16c; font-family:'Cinzel'; font-size:20px;">Shopping Bag</div>
</nav>
<div class="cart-wrapper">
    <h2>Review Order</h2>
    <div id="cart-items-target"></div>
    <div class="totals-box">
        <div class="totals-row"><span>Items Subtotal:</span><span id="txt-subtotal">$0.00</span></div>
        <div class="totals-row"><span>MI Sales Tax (6% Exclusive):</span><span id="txt-tax">$0.00</span></div>
        <div class="totals-row"><span>USPS Flat Rate Shipping:</span><span id="txt-shipping">$0.00</span></div>
        <div class="totals-row" style="font-size:1.3rem; color:#fff; font-weight:bold; border-top:1px solid rgba(232,193,108,0.1); padding-top:8px;">
            <span>Grand Total:</span><span id="txt-final">$0.00</span>
        </div>
    </div>
    <button class="btn" onclick="checkoutViaCustomWorker()">Proceed to Payment</button>
</div>
<script>
    let activeCart = [];
    function loadCartData() {
        activeCart = JSON.parse(localStorage.getItem('cc_cart_store') || '[]');
        const container = document.getElementById('cart-items-target');
        container.innerHTML = '';
        if (activeCart.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#aaa; padding:20px;">Your cart is empty.</p>';
            return;
        }
        let totalAmount = 0;
        activeCart.forEach(item => {
            totalAmount += item.price * item.quantity;
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `
                <div>
                    <div class="item-title">${item.name}</div>
                    <div style="font-size:0.85rem; color:#aaa;">Scent: ${item.scent}</div>
                </div>
                <div style="color:#fff; font-weight:600;">$${(item.price * item.quantity).toFixed(2)} (${item.quantity})</div>
            `;
            container.appendChild(div);
        });
        const taxAmount = totalAmount * 0.06; 
        const shippingFee = activeCart.length > 0 ? 15.00 : 0.00;
        const grandTotal = totalAmount + taxAmount + shippingFee;
        document.getElementById('txt-subtotal').innerText = `$${totalAmount.toFixed(2)}`;
        document.getElementById('txt-tax').innerText = `$${taxAmount.toFixed(2)}`;
        document.getElementById('txt-shipping').innerText = `$${shippingFee.toFixed(2)}`;
        document.getElementById('txt-final').innerText = `$${grandTotal.toFixed(2)}`;
    }
    function checkoutViaCustomWorker() {
        if (activeCart.length === 0) return alert('Your cart is empty.');
        let hasSoap = activeCart.some(i => i.id === 'handmade-soap');
        let hasCandle = activeCart.some(i => i.id === 'artisan-candle');
        let finalStripeUrl = "";
        if (hasSoap && hasCandle) {
            finalStripeUrl = "https://buy.stripe.com/test_8x25kD0rm2lG4pZf3S7AI02";
        } else if (hasSoap) {
            finalStripeUrl = "https://buy.stripe.com/test_14AbJ1a1Wd0kf4DdZO7AI00";
        } else if (hasCandle) {
            finalStripeUrl = "https://buy.stripe.com/test_3cI7sLa1WaScaOndZO7AI01";
        }
        window.location.href = finalStripeUrl;
    }
    window.addEventListener('DOMContentLoaded', loadCartData);
</script>
</body>
</html>
